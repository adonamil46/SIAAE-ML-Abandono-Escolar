<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 470" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="freqBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <filter id="shadow6" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="850" height="470" rx="14" fill="url(#bgGrad6)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="425" y="40" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">
    Figura 6. Distribución de Frecuencias de Conteos de Abandono por Sección-Año (n = 33)
  </text>
  <text x="425" y="64" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">
    Variable discreta asimétrica con predominio de ceros (51.5 %), justificando modelos de conteo (Poisson) sobre regresión lineal
  </text>

  <!-- Grid: y=375 (0) to y=105 (18) -> 15px per unit -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4">
    <line x1="95" y1="375" x2="590" y2="375" stroke="#94a3b8" stroke-dasharray="0" stroke-width="1.5"/>
    <line x1="95" y1="330" x2="590" y2="330"/>
    <line x1="95" y1="285" x2="590" y2="285"/>
    <line x1="95" y1="240" x2="590" y2="240"/>
    <line x1="95" y1="195" x2="590" y2="195"/>
    <line x1="95" y1="150" x2="590" y2="150"/>
    <line x1="95" y1="105" x2="590" y2="105"/>
  </g>

  <!-- Y Axis Labels -->
  <g font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="end">
    <text x="83" y="379">0</text>
    <text x="83" y="334">3</text>
    <text x="83" y="289">6</text>
    <text x="83" y="244">9</text>
    <text x="83" y="199">12</text>
    <text x="83" y="154">15</text>
    <text x="83" y="109">18</text>
  </g>
  <text x="38" y="240" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle" transform="rotate(-90 38,240)">
    Frecuencia (número de secciones-año)
  </text>

  <!-- Count = 0: freq = 17 -> h = 255, y = 120 -->
  <rect x="125" y="120" width="75" height="255" rx="5" fill="url(#freqBar)" filter="url(#shadow6)"/>
  <text x="162" y="108" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#3730a3" text-anchor="middle">17</text>
  <text x="162" y="245" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">51.5 %</text>
  <text x="162" y="398" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">0 casos</text>
  <text x="162" y="415" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">(11 en 24-25; 6 en 25-26)</text>

  <!-- Count = 1: freq = 10 -> h = 150, y = 225 -->
  <rect x="225" y="225" width="75" height="150" rx="5" fill="url(#freqBar)" filter="url(#shadow6)"/>
  <text x="262" y="213" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#3730a3" text-anchor="middle">10</text>
  <text x="262" y="305" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">30.3 %</text>
  <text x="262" y="398" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">1 caso</text>
  <text x="262" y="415" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">(5 en 24-25; 5 en 25-26)</text>

  <!-- Count = 2: freq = 5 -> h = 75, y = 300 -->
  <rect x="325" y="300" width="75" height="75" rx="5" fill="url(#freqBar)" filter="url(#shadow6)"/>
  <text x="362" y="288" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#3730a3" text-anchor="middle">5</text>
  <text x="362" y="343" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">15.2 %</text>
  <text x="362" y="398" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">2 casos</text>
  <text x="362" y="415" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">(2 en 24-25; 3 en 25-26)</text>

  <!-- Count = 3: freq = 0 -->
  <rect x="425" y="371" width="75" height="4" rx="2" fill="#cbd5e1"/>
  <text x="462" y="363" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">0</text>
  <text x="462" y="398" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">3 casos</text>
  <text x="462" y="415" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">(0.0 %)</text>

  <!-- Count = 4: freq = 1 -> h = 15, y = 360 -->
  <rect x="525" y="360" width="75" height="15" rx="4" fill="#dc2626" filter="url(#shadow6)"/>
  <text x="562" y="350" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="800" fill="#dc2626" text-anchor="middle">1</text>
  <text x="562" y="398" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">4 casos</text>
  <text x="562" y="415" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle">(1.º C en 25-26 · 3.0 %)</text>

  <!-- Statistical Summary Card -->
  <rect x="625" y="105" width="198" height="270" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow6)"/>
  <text x="724" y="130" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">ESTADÍSTICA DE LA SERIE</text>
  <line x1="640" y1="140" x2="808" y2="140" stroke="#e2e8f0" stroke-width="1"/>
  <g font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" fill="#334155">
    <text x="640" y="164">• Observaciones (n):</text><text x="808" y="164" font-weight="700" text-anchor="end">33</text>
    <text x="640" y="188">• Suma total (Σy):</text><text x="808" y="188" font-weight="700" text-anchor="end">24</text>
    <text x="640" y="212">• Media muestral:</text><text x="808" y="212" font-weight="700" text-anchor="end">0.7273</text>
    <text x="640" y="236">• Mediana:</text><text x="808" y="236" font-weight="700" text-anchor="end">0.0000</text>
    <text x="640" y="260">• Desv. estándar (s):</text><text x="808" y="260" font-weight="700" text-anchor="end">0.9445</text>
    <text x="640" y="284">• Varianza (s²):</text><text x="808" y="284" font-weight="700" text-anchor="end">0.8920</text>
    <text x="640" y="308">• Mínimo / Máximo:</text><text x="808" y="308" font-weight="700" text-anchor="end">0 / 4</text>
    <text x="640" y="332">• Secciones con 0:</text><text x="808" y="332" font-weight="700" text-anchor="end">17 (51.5 %)</text>
    <text x="640" y="356">• Secciones con ≥1:</text><text x="808" y="356" font-weight="700" text-anchor="end">16 (48.5 %)</text>
  </g>

  <!-- Footer -->
  <text x="425" y="452" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Fuente: Registros institucionales verificados del Politécnico José Antonio Castillo Ferreiras (SIAAE-ML, UFHEC 2026).
  </text>
</svg>
