<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="c24" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="c25" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="cTot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="850" height="480" rx="14" fill="url(#bgGrad2)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="425" y="42" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">
    Figura 2. Distribución Comparativa del Abandono por Ciclo Educativo y Período
  </text>
  <text x="425" y="66" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">
    Primer Ciclo (1.º a 3.º: 16 casos, 66.7 %) vs. Segundo Ciclo Técnico-Profesional (4.º a 6.º: 8 casos, 33.3 %)
  </text>

  <!-- Legend -->
  <g transform="translate(215, 84)" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#334155">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="url(#c24)"/>
    <text x="24" y="13">2024-2025 (Total: 9)</text>
    <rect x="165" y="0" width="16" height="16" rx="3" fill="url(#c25)"/>
    <text x="189" y="13">2025-2026 (Total: 15)</text>
    <rect x="340" y="0" width="16" height="16" rx="3" fill="url(#cTot)"/>
    <text x="364" y="13">Acumulado (Total: 24)</text>
  </g>

  <!-- Grid: y=380 (0) to y=124 (16) -> 16px per unit -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4">
    <line x1="95" y1="380" x2="790" y2="380" stroke="#94a3b8" stroke-dasharray="0" stroke-width="1.5"/>
    <line x1="95" y1="348" x2="790" y2="348"/>
    <line x1="95" y1="316" x2="790" y2="316"/>
    <line x1="95" y1="284" x2="790" y2="284"/>
    <line x1="95" y1="252" x2="790" y2="252"/>
    <line x1="95" y1="220" x2="790" y2="220"/>
    <line x1="95" y1="188" x2="790" y2="188"/>
    <line x1="95" y1="156" x2="790" y2="156"/>
    <line x1="95" y1="124" x2="790" y2="124"/>
  </g>

  <!-- Y Axis Labels -->
  <g font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="end">
    <text x="83" y="384">0</text>
    <text x="83" y="352">2</text>
    <text x="83" y="320">4</text>
    <text x="83" y="288">6</text>
    <text x="83" y="256">8</text>
    <text x="83" y="224">10</text>
    <text x="83" y="192">12</text>
    <text x="83" y="160">14</text>
    <text x="83" y="128">16</text>
  </g>
  <text x="38" y="252" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle" transform="rotate(-90 38,252)">
    Abandonos confirmados
  </text>

  <!-- GROUP 1: Primer Ciclo (1.º a 3.º) -->
  <!-- 2024-2025: 6 -> h=96, y=284 -->
  <rect x="145" y="284" width="68" height="96" rx="5" fill="url(#c24)" filter="url(#shadow2)"/>
  <text x="179" y="274" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#1d4ed8" text-anchor="middle">6</text>

  <!-- 2025-2026: 10 -> h=160, y=220 -->
  <rect x="225" y="220" width="68" height="160" rx="5" fill="url(#c25)" filter="url(#shadow2)"/>
  <text x="259" y="210" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#c2410c" text-anchor="middle">10</text>

  <!-- Acumulado: 16 -> h=256, y=124 -->
  <rect x="305" y="124" width="68" height="256" rx="5" fill="url(#cTot)" filter="url(#shadow2)"/>
  <text x="339" y="114" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#0f766e" text-anchor="middle">16</text>
  <text x="339" y="250" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">66.7 %</text>

  <text x="259" y="405" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Primer Ciclo (1.º a 3.º)</text>
  <text x="259" y="423" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">Variación interanual: +4 casos (+66.7 %)</text>

  <!-- GROUP 2: Segundo Ciclo Técnico-Profesional (4.º a 6.º) -->
  <!-- 2024-2025: 3 -> h=48, y=332 -->
  <rect x="495" y="332" width="68" height="48" rx="5" fill="url(#c24)" filter="url(#shadow2)"/>
  <text x="529" y="322" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#1d4ed8" text-anchor="middle">3</text>

  <!-- 2025-2026: 5 -> h=80, y=300 -->
  <rect x="575" y="300" width="68" height="80" rx="5" fill="url(#c25)" filter="url(#shadow2)"/>
  <text x="609" y="290" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#c2410c" text-anchor="middle">5</text>

  <!-- Acumulado: 8 -> h=128, y=252 -->
  <rect x="655" y="252" width="68" height="128" rx="5" fill="url(#cTot)" filter="url(#shadow2)"/>
  <text x="689" y="242" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="800" fill="#0f766e" text-anchor="middle">8</text>
  <text x="689" y="318" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">33.3 %</text>

  <text x="609" y="405" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Segundo Ciclo Técnico-Profesional (4.º a 6.º)</text>
  <text x="609" y="423" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">Variación interanual: +2 casos (+66.7 %)</text>

  <!-- Footer -->
  <text x="425" y="458" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Fuente: Registros institucionales verificados del Politécnico José Antonio Castillo Ferreiras (SIAAE-ML, UFHEC 2026).
  </text>
</svg>
