<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="bar24" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="bar25" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="480" rx="14" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="425" y="42" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">
    Figura 1. Comparación de Conteos de Abandono Escolar por Período Académico
  </text>
  <text x="425" y="66" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">
    Politécnico José Antonio Castillo Ferreiras (2024-2025 vs. 2025-2026) · Total acumulado: 24 casos en 33 secciones-año
  </text>

  <!--KPI Callout Box -->
  <rect x="615" y="95" width="205" height="92" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="717" y="120" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="700" fill="#9a3412" text-anchor="middle">VARIACIÓN OBSERVADA</text>
  <text x="717" y="148" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="24" font-weight="800" fill="#ea580c" text-anchor="middle">+6 casos (+66.7 %)</text>
  <text x="717" y="168" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#7c2d12" text-anchor="middle">Variación del conteo absoluto</text>
  <text x="717" y="181" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="middle">(No representa tasa sin matrícula)</text>

  <!-- Plot Area Grid -->
  <!-- Y axis from y=380 (0) to y=110 (18) -> 15px per unit -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4">
    <line x1="100" y1="380" x2="585" y2="380" stroke="#94a3b8" stroke-dasharray="0" stroke-width="1.5"/>
    <line x1="100" y1="335" x2="585" y2="335"/>
    <line x1="100" y1="290" x2="585" y2="290"/>
    <line x1="100" y1="245" x2="585" y2="245"/>
    <line x1="100" y1="200" x2="585" y2="200"/>
    <line x1="100" y1="155" x2="585" y2="155"/>
    <line x1="100" y1="110" x2="585" y2="110"/>
  </g>

  <!-- Y Axis Labels -->
  <g font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="end">
    <text x="88" y="384">0</text>
    <text x="88" y="339">3</text>
    <text x="88" y="294">6</text>
    <text x="88" y="249">9</text>
    <text x="88" y="204">12</text>
    <text x="88" y="159">15</text>
    <text x="88" y="114">18</text>
  </g>
  <text x="38" y="245" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="middle" transform="rotate(-90 38,245)">
    Número de abandonos confirmados
  </text>

  <!-- Bar 1: 2024-2025 (Value = 9 -> height = 135, y = 245) -->
  <rect x="165" y="245" width="120" height="135" rx="6" fill="url(#bar24)" filter="url(#shadow)"/>
  <text x="225" y="233" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#1e40af" text-anchor="middle">9</text>
  <text x="225" y="305" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">37.5 % del total</text>
  <text x="225" y="323" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#dbeafe" text-anchor="middle">(Media: 0.53 / secc.)</text>
  <text x="225" y="404" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">2024-2025</text>
  <text x="225" y="422" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">17 secciones reportadas</text>

  <!-- Bar 2: 2025-2026 (Value = 15 -> height = 225, y = 155) -->
  <rect x="395" y="155" width="120" height="225" rx="6" fill="url(#bar25)" filter="url(#shadow)"/>
  <text x="455" y="143" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="800" fill="#c2410c" text-anchor="middle">15</text>
  <text x="455" y="255" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">62.5 % del total</text>
  <text x="455" y="273" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#ffedd5" text-anchor="middle">(Media: 0.94 / secc.)</text>
  <text x="455" y="404" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">2025-2026</text>
  <text x="455" y="422" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">16 secciones reportadas (1.º D s/r)</text>

  <!-- Trend Connector -->
  <path d="M 285 245 Q 340 190 390 158" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="393,155 383,157 389,165" fill="#64748b"/>

  <!-- Summary Table Box on Right -->
  <rect x="615" y="205" width="205" height="175" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
  <text x="717" y="228" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="middle">RESUMEN INSTITUCIONAL</text>
  <line x1="630" y1="238" x2="805" y2="238" stroke="#e2e8f0" stroke-width="1"/>
  <g font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" fill="#334155">
    <text x="630" y="260">• Total 2024-2025:</text>
    <text x="800" y="260" font-weight="700" text-anchor="end">9 casos</text>
    <text x="630" y="282">• Total 2025-2026:</text>
    <text x="800" y="282" font-weight="700" text-anchor="end">15 casos</text>
    <text x="630" y="304">• Total acumulado:</text>
    <text x="800" y="304" font-weight="700" text-anchor="end">24 casos</text>
    <text x="630" y="326">• Observaciones:</text>
    <text x="800" y="326" font-weight="700" text-anchor="end">33 secc.-año</text>
    <text x="630" y="348">• Media global:</text>
    <text x="800" y="348" font-weight="700" text-anchor="end">0.73 / secc.</text>
    <text x="630" y="368" font-size="10.5" fill="#64748b">* Traslados excluidos del conteo</text>
  </g>

  <!-- Footer Note -->
  <text x="425" y="458" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Fuente: Registros institucionales verificados del Politécnico José Antonio Castillo Ferreiras (SIAAE-ML, UFHEC 2026).
  </text>
</svg>
