<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="920" height="520" rx="14" fill="url(#bgGrad4)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="460" y="38" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="19.5" font-weight="700" fill="#0f172a" text-anchor="middle">
    Figura 4. Abandono por Especialidad Técnico-Profesional (4.º-6.º) y Secciones con Casos Registrados
  </text>
  <text x="460" y="60" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle">
    Desglose del Segundo Ciclo por especialidad técnica y ranking de las secciones con mayor incidencia acumulada
  </text>

  <!-- LEFT PANEL: Especialidades Técnico-Profesionales (Segundo Ciclo: 8 casos) -->
  <rect x="28" y="80" width="420" height="395" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow4)"/>
  <text x="238" y="108" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="middle">
    A) Segundo Ciclo por Especialidad Técnica (4.º a 6.º)
  </text>
  <text x="238" y="126" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">
    Total del Segundo Ciclo: 8 abandonos (3 en 2024-2025 y 5 en 2025-2026)
  </text>

  <!-- Legend Left Panel -->
  <g transform="translate(110, 140)" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#334155">
    <rect x="0" y="0" width="13" height="13" rx="2" fill="#2563eb"/>
    <text x="18" y="11">2024-2025</text>
    <rect x="95" y="0" width="13" height="13" rx="2" fill="#ea580c"/>
    <text x="113" y="11">2025-2026</text>
    <rect x="190" y="0" width="13" height="13" rx="2" fill="#0d9488"/>
    <text x="208" y="11">Acumulado</text>
  </g>

  <!-- Especialidad 1: Producción Agropecuaria (Sección A): 24-25=2, 25-26=4, Total=6 -->
  <text x="48" y="188" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b">1. Producción Agropecuaria (Secciones A)</text>
  <rect x="48" y="196" width="80" height="16" rx="3" fill="#2563eb"/>
  <text x="135" y="208" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1e40af">2 casos (2024-2025: 4.ºA=1, 5.ºA=1)</text>
  <rect x="48" y="216" width="160" height="16" rx="3" fill="#ea580c"/>
  <text x="215" y="228" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#c2410c">4 casos (2025-2026: 4.ºA=2, 5.ºA=2)</text>
  <rect x="48" y="236" width="240" height="18" rx="3" fill="#0d9488"/>
  <text x="296" y="249" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#0f766e">Total: 6 (75.0 % del 2.º ciclo)</text>

  <!-- Especialidad 2: Comercio y Mercadeo (Sección B): 24-25=1, 25-26=0, Total=1 -->
  <text x="48" y="286" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b">2. Comercio y Mercadeo (Secciones B)</text>
  <rect x="48" y="294" width="40" height="16" rx="3" fill="#2563eb"/>
  <text x="95" y="306" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1e40af">1 caso (2024-2025: 4.ºB=1)</text>
  <rect x="48" y="314" width="6" height="16" rx="2" fill="#cbd5e1"/>
  <text x="62" y="326" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" fill="#64748b">0 casos (2025-2026)</text>
  <rect x="48" y="334" width="40" height="18" rx="3" fill="#0d9488"/>
  <text x="96" y="347" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#0f766e">Total: 1 (12.5 % del 2.º ciclo)</text>

  <!-- Especialidad 3: Gestión Administrativa y Tributaria (Sección C): 24-25=0, 25-26=1, Total=1 -->
  <text x="48" y="384" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b">3. Gestión Administrativa y Tributaria (Secciones C)</text>
  <rect x="48" y="392" width="6" height="16" rx="2" fill="#cbd5e1"/>
  <text x="62" y="404" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" fill="#64748b">0 casos (2024-2025)</text>
  <rect x="48" y="412" width="40" height="16" rx="3" fill="#ea580c"/>
  <text x="95" y="424" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#c2410c">1 caso (2025-2026: 5.ºC=1)</text>
  <rect x="48" y="432" width="40" height="18" rx="3" fill="#0d9488"/>
  <text x="96" y="445" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="12" font-weight="800" fill="#0f766e">Total: 1 (12.5 % del 2.º ciclo)</text>

  <!-- RIGHT PANEL: Ranking de Secciones con Abandonos Confirmados -->
  <rect x="468" y="80" width="424" height="395" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow4)"/>
  <text x="680" y="108" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="middle">
    B) Secciones con Casos Registrados (2024-2026)
  </text>
  <text x="680" y="126" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">
    11 secciones acumulan los 24 casos (6 secciones tienen 0 en ambos años)
  </text>

  <!-- Horizontal Stacked Bars per Section (Scale: 50px per unit) -->
  <g font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5">
    <!-- 1.º C: 0 + 4 = 4 -->
    <text x="545" y="160" font-weight="700" fill="#0f172a" text-anchor="end">1.º C (1.er C.)</text>
    <rect x="555" y="147" width="200" height="18" rx="3" fill="#ea580c"/>
    <text x="763" y="160" font-weight="700" fill="#c2410c">4 casos (0 → 4)</text>

    <!-- 2.º B: 2 + 2 = 4 -->
    <text x="545" y="188" font-weight="700" fill="#0f172a" text-anchor="end">2.º B (1.er C.)</text>
    <rect x="555" y="175" width="100" height="18" rx="3" fill="#2563eb"/>
    <rect x="655" y="175" width="100" height="18" rx="3" fill="#ea580c"/>
    <text x="763" y="188" font-weight="700" fill="#1e293b">4 casos (2 → 2)</text>

    <!-- 2.º A: 2 + 1 = 3 -->
    <text x="545" y="216" font-weight="700" fill="#0f172a" text-anchor="end">2.º A (1.er C.)</text>
    <rect x="555" y="203" width="100" height="18" rx="3" fill="#2563eb"/>
    <rect x="655" y="203" width="50" height="18" rx="3" fill="#ea580c"/>
    <text x="713" y="216" font-weight="700" fill="#1e293b">3 casos (2 → 1)</text>

    <!-- 4.º A: 1 + 2 = 3 -->
    <text x="545" y="244" font-weight="700" fill="#0f172a" text-anchor="end">4.º A (Agro.)</text>
    <rect x="555" y="231" width="50" height="18" rx="3" fill="#2563eb"/>
    <rect x="605" y="231" width="100" height="18" rx="3" fill="#ea580c"/>
    <text x="713" y="244" font-weight="700" fill="#1e293b">3 casos (1 → 2)</text>

    <!-- 5.º A: 1 + 2 = 3 -->
    <text x="545" y="272" font-weight="700" fill="#0f172a" text-anchor="end">5.º A (Agro.)</text>
    <rect x="555" y="259" width="50" height="18" rx="3" fill="#2563eb"/>
    <rect x="605" y="259" width="100" height="18" rx="3" fill="#ea580c"/>
    <text x="713" y="272" font-weight="700" fill="#1e293b">3 casos (1 → 2)</text>

    <!-- 3.º A: 1 + 1 = 2 -->
    <text x="545" y="300" font-weight="700" fill="#0f172a" text-anchor="end">3.º A (1.er C.)</text>
    <rect x="555" y="287" width="50" height="18" rx="3" fill="#2563eb"/>
    <rect x="605" y="287" width="50" height="18" rx="3" fill="#ea580c"/>
    <text x="663" y="300" font-weight="700" fill="#1e293b">2 casos (1 → 1)</text>

    <!-- 1.º A: 0 + 1 = 1 -->
    <text x="545" y="328" font-weight="600" fill="#334155" text-anchor="end">1.º A (1.er C.)</text>
    <rect x="555" y="315" width="50" height="18" rx="3" fill="#ea580c"/>
    <text x="613" y="328" fill="#475569">1 caso (0 → 1)</text>

    <!-- 1.º B: 0 + 1 = 1 -->
    <text x="545" y="356" font-weight="600" fill="#334155" text-anchor="end">1.º B (1.er C.)</text>
    <rect x="555" y="343" width="50" height="18" rx="3" fill="#ea580c"/>
    <text x="613" y="356" fill="#475569">1 caso (0 → 1)</text>

    <!-- 1.º D: 1 + s/r = 1 -->
    <text x="545" y="384" font-weight="600" fill="#334155" text-anchor="end">1.º D (1.er C.)</text>
    <rect x="555" y="371" width="50" height="18" rx="3" fill="#2563eb"/>
    <text x="613" y="384" fill="#475569">1 caso (1 → no rep.)</text>

    <!-- 4.º B: 1 + 0 = 1 -->
    <text x="545" y="412" font-weight="600" fill="#334155" text-anchor="end">4.º B (Com.)</text>
    <rect x="555" y="399" width="50" height="18" rx="3" fill="#2563eb"/>
    <text x="613" y="412" fill="#475569">1 caso (1 → 0)</text>

    <!-- 5.º C: 0 + 1 = 1 -->
    <text x="545" y="440" font-weight="600" fill="#334155" text-anchor="end">5.º C (Gest.)</text>
    <rect x="555" y="427" width="50" height="18" rx="3" fill="#ea580c"/>
    <text x="613" y="440" fill="#475569">1 caso (0 → 1)</text>

    <text x="680" y="464" font-size="11" fill="#64748b" text-anchor="middle">
      Secciones con 0 casos en ambos años: 3.º B, 4.º C, 5.º B, 6.º A, 6.º B y 6.º C
    </text>
  </g>

  <!-- Footer -->
  <text x="460" y="502" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Fuente: Registros institucionales verificados del Politécnico José Antonio Castillo Ferreiras (SIAAE-ML, UFHEC 2026).
  </text>
</svg>
