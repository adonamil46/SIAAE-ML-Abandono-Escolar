<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="840" height="520" rx="22" fill="url(#bgGrad)"/>

  <!-- Red Neuronal / Nodos de IA Decorativos -->
  <g stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1.5">
    <line x1="90" y1="90" x2="210" y2="150"/>
    <line x1="90" y1="90" x2="170" y2="260"/>
    <line x1="210" y1="150" x2="340" y2="110"/>
    <line x1="170" y1="260" x2="310" y2="290"/>
    <line x1="680" y1="80" x2="760" y2="170"/>
    <line x1="680" y1="80" x2="590" y2="150"/>
    <line x1="760" y1="170" x2="720" y2="310"/>
  </g>
  <g fill="#38bdf8" fill-opacity="0.45">
    <circle cx="90" cy="90" r="6"/>
    <circle cx="210" cy="150" r="5"/>
    <circle cx="170" cy="260" r="7"/>
    <circle cx="340" cy="110" r="4"/>
    <circle cx="680" cy="80" r="6"/>
    <circle cx="760" cy="170" r="5"/>
    <circle cx="720" cy="310" r="7"/>
  </g>

  <!-- Panel Central de Analítica SIAAE-ML -->
  <rect x="65" y="55" width="710" height="410" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Barra superior de ventana -->
  <rect x="65" y="55" width="710" height="42" rx="16" fill="#1e293b"/>
  <circle cx="92" cy="76" r="6" fill="#ef4444"/>
  <circle cx="112" cy="76" r="6" fill="#f59e0b"/>
  <circle cx="132" cy="76" r="6" fill="#10b981"/>
  <text x="420" y="81" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    SIAAE-ML · Politécnico José Antonio Castillo Ferreiras (2024-2025 vs. 2025-2026)
  </text>

  <!-- Tarjetas KPI Superiores -->
  <g transform="translate(95, 115)">
    <rect width="150" height="74" rx="10" fill="#0f172a" stroke="#1e3a8a" stroke-width="1.5"/>
    <text x="16" y="24" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">OBSERVACIONES</text>
    <text x="16" y="52" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">33</text>
    <text x="62" y="51" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">Secciones-Año</text>
  </g>

  <g transform="translate(262, 115)">
    <rect width="150" height="74" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="1.5"/>
    <text x="16" y="24" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">ABANDONO TOTAL</text>
    <text x="16" y="52" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">24</text>
    <text x="62" y="51" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">9 → 15 (+66.7%)</text>
  </g>

  <g transform="translate(429, 115)">
    <rect width="150" height="74" rx="10" fill="#0f172a" stroke="#0d9488" stroke-width="1.5"/>
    <text x="16" y="24" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">PRIMER CICLO</text>
    <text x="16" y="52" fill="#2dd4bf" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">66.7%</text>
    <text x="92" y="51" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">16 casos</text>
  </g>

  <g transform="translate(596, 115)">
    <rect width="150" height="74" rx="10" fill="#0f172a" stroke="#d97706" stroke-width="1.5"/>
    <text x="16" y="24" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">RETENCIÓN 6.º</text>
    <text x="16" y="52" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">100%</text>
    <text x="88" y="51" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">0 abandonos</text>
  </g>

  <!-- Gráfico Izquierdo: Comparación por Grado -->
  <g transform="translate(95, 210)">
    <rect width="340" height="225" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="28" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">
      Concentración por Grado Escolar (1.º a 6.º)
    </text>
    <!-- Ejes -->
    <line x1="40" y1="185" x2="315" y2="185" stroke="#475569" stroke-width="1.2"/>
    <!-- Barras (1.º=7, 2.º=7, 3.º=2, 4.º=4, 5.º=4, 6.º=0) -->
    <rect x="55" y="73" width="26" height="112" rx="4" fill="url(#accentBlue)"/>
    <text x="68" y="66" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">7</text>
    <text x="68" y="203" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">1.º</text>

    <rect x="98" y="73" width="26" height="112" rx="4" fill="url(#accentBlue)"/>
    <text x="111" y="66" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">7</text>
    <text x="111" y="203" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">2.º</text>

    <rect x="141" y="153" width="26" height="32" rx="4" fill="#38bdf8" fill-opacity="0.75"/>
    <text x="154" y="146" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2</text>
    <text x="154" y="203" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">3.º</text>

    <rect x="184" y="121" width="26" height="64" rx="4" fill="url(#accentAmber)"/>
    <text x="197" y="114" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">4</text>
    <text x="197" y="203" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">4.º</text>

    <rect x="227" y="121" width="26" height="64" rx="4" fill="url(#accentAmber)"/>
    <text x="240" y="114" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">4</text>
    <text x="240" y="203" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">5.º</text>

    <rect x="270" y="182" width="26" height="3" rx="1.5" fill="#4ade80"/>
    <text x="283" y="174" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">0</text>
    <text x="283" y="203" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">6.º</text>
  </g>

  <!-- Panel Derecho: Curva Logística + Árbol RF + Ética -->
  <g transform="translate(455, 210)">
    <rect width="290" height="225" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="28" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">
      Arquitectura Analítica y Viabilidad ML
    </text>
    <!-- Curva sigmoide estilizada -->
    <path d="M 30 155 C 95 155, 115 65, 185 65" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <line x1="30" y1="110" x2="185" y2="110" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="4,4"/>
    <text x="32" y="103" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="10">Umbral Preventivo τ</text>

    <!-- Nodos de árbol estilizados -->
    <circle cx="235" cy="72" r="10" fill="#0d9488"/>
    <line x1="235" y1="82" x2="215" y2="115" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="235" y1="82" x2="255" y2="115" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="215" cy="122" r="8" fill="#2563eb"/>
    <circle cx="255" cy="122" r="8" fill="#d97706"/>

    <!-- Etiquetas inferiores -->
    <rect x="20" y="172" width="250" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="145" y="194" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
      EDA Real (n=33) + Diseño Supervisado Fase II
    </text>
  </g>
</svg>
